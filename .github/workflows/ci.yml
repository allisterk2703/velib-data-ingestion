name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: uv run ruff check dags/ src/ tests/ utils/

      - name: Format check
        run: uv run ruff format --check dags/ src/ tests/ utils/

      - name: Tests
        run: uv run pytest tests/
